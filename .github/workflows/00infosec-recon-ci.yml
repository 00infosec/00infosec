name: 00infosec-recon CI

on:
  push:
    branches: [main]
    paths:
      - "tools/00infosec-recon/00infosec-recon/**"
      - ".github/workflows/00infosec-recon-ci.yml"
  pull_request:
    paths:
      - "tools/00infosec-recon/00infosec-recon/**"
      - ".github/workflows/00infosec-recon-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/00infosec-recon/00infosec-recon

jobs:
  test:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/00infosec-recon/00infosec-recon/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[full,mcp,dev]"

      - name: Lint
        run: ruff check --select F,E9 --line-length 110 infosec_recon tests

      - name: Unit tests
        run: python -m pytest -q

      - name: CLI smoke
        shell: bash
        run: |
          python -m infosec_recon --list-modules
          python -m infosec_recon --help

      - name: MCP smoke
        run: python tests/mcp_smoke_ci.py
