[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infosec-recon"
version = "0.2.0"
description = "00INFOSEC RECON - unified OSINT/attack-surface framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "rich>=13.0",
]

[project.optional-dependencies]
full = [
    "dnspython>=2.4",
    "beautifulsoup4>=4.12",
]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/00infosec/00infosec/tree/main/tools/00infosec-recon/00infosec-recon"
Repository = "https://github.com/00infosec/00infosec"
Issues = "https://github.com/00infosec/00infosec/issues"
Changelog = "https://github.com/00infosec/00infosec/blob/main/tools/00infosec-recon/00infosec-recon/CHANGELOG.md"

[project.scripts]
infosec = "infosec_recon.cli:main"
infosec-recon = "infosec_recon.cli:main"
infosec-mcp = "infosec_recon.mcp_server:main"

[tool.setuptools.packages.find]
include = ["infosec_recon*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
